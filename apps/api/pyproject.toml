[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
markers = ["unit: isolated test that does not require PostgreSQL or Redis"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
