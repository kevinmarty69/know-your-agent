services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: limiq
      POSTGRES_PASSWORD: limiq
      POSTGRES_DB: limiq
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limiq"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data_v2:
  redis_data:
